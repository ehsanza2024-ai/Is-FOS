<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="گزارش مازندشت" />
    <meta name="theme-color" content="#153e35" />
    <title>مازندشت | پنل گزارش فقط‌خواندنی</title>
    <style>@font-face {
  font-family: Local;
  src: local("Vazirmatn"), local("Tahoma");
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  font-family: Local, Tahoma, Arial, sans-serif;
  background: #f4f6f3;
  color: #233b34;
  font-size: 13px;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select {
  outline-offset: 4px;
}
button,
a {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
a {
  color: inherit;
  text-decoration: none;
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.shell {
  height: 100dvh;
  display: grid;
  grid-template-columns: 224px 1fr;
  grid-template-rows: 1fr;
  direction: rtl;
}
.sidebar {
  background: #153e35;
  color: #c1d4ca;
  padding: 27px 18px 16px;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #f6f9eb;
  margin: 0 10px 27px;
}
.mark {
  width: 43px;
  height: 43px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: #d7e9af;
  color: #153e35;
}
.mark svg {
  width: 31px;
  height: 31px;
}
.brand h1 {
  font-size: 24px;
  margin: 0 0 4px;
  font-weight: 800;
  letter-spacing: -1px;
}
.brand small {
  font-size: 9px;
  letter-spacing: 2px;
  color: #98b5a7;
}
.navgroup {
  font-size: 10px;
  margin: 15px 14px 8px;
  color: #799e8e;
}
.navitem {
  border: 0;
  background: transparent;
  color: inherit;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  border-radius: 9px;
  padding: 11px 14px;
  text-align: right;
  transition: 0.2s;
  margin: 2px 0;
}
.navitem svg {
  width: 18px;
  height: 18px;
}
.navitem:hover {
  background: #204d41;
  color: white;
}
.navitem.active {
  background: #d5e8af;
  color: #153e35;
  font-weight: 700;
}
.navitem.active:after {
  content: "";
  margin-right: auto;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #153e35;
}
.sidebarfoot {
  margin-top: auto;
  border-top: 1px solid #31564a;
  padding: 15px 9px 0;
  display: flex;
  gap: 9px;
  align-items: center;
  font-size: 11px;
}
.pulse {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #b6d998;
  border-radius: 50%;
  box-shadow: 0 0 0 4px #ffffff09;
}
.workspace {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  height: 77px;
  flex-shrink: 0;
  border-bottom: 1px solid #e0e7df;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  background: #fafbf8;
  gap: 14px;
}
.breadcrumb {
  font-size: 11px;
  color: #85958c;
  display: flex;
  align-items: center;
  gap: 10px;
}
.breadcrumb b {
  color: #334d41;
  font-weight: 500;
}
.topactions {
  display: flex;
  align-items: center;
  gap: 16px;
}
.date {
  color: #6d8177;
  font-size: 11px;
  white-space: nowrap;
}
.iconbtn {
  border: 1px solid #e1e7de;
  background: #fff;
  width: 33px;
  height: 33px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: #4b6657;
}
.iconbtn svg {
  width: 17px;
  height: 17px;
}
.profile {
  display: flex;
  gap: 9px;
  align-items: center;
  padding-right: 14px;
  border-right: 1px solid #e2e7dd;
}
.avatar {
  background: #e9eedd;
  color: #3b5945;
  width: 33px;
  height: 33px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-weight: bold;
}
.profile strong {
  display: block;
  font-size: 11px;
}
.profile small {
  font-size: 9px;
  color: #8a978e;
}
.content {
  padding: 26px 32px 14px;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.eyebrow {
  font-size: 10px;
  color: #7f9284;
  margin-bottom: 7px;
  letter-spacing: 1px;
}
.heading h2 {
  font-size: 24px;
  letter-spacing: -0.8px;
  margin: 0 0 9px;
  font-weight: 700;
}
.heading p {
  font-size: 11px;
  color: #809084;
  margin: 0;
}
.btn {
  border: 1px solid #dbe3d6;
  border-radius: 8px;
  background: #fff;
  color: #365241;
  padding: 10px 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  font-size: 11px;
}
.btn svg {
  width: 16px;
  height: 16px;
}
.btn.primary {
  background: #204d3c;
  color: #fff;
  border-color: #204d3c;
}
.btn.soft {
  background: #edf2e4;
  border-color: #edf2e4;
}
.btn.danger {
  color: #a1403a;
}
.buttons {
  display: flex;
  gap: 8px;
  align-items: center;
}
.notice {
  padding: 9px 14px;
  background: #f9f3e1;
  border: 1px solid #e9dfbc;
  border-radius: 8px;
  color: #93804c;
  font-size: 10px;
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
}
.notice svg {
  width: 15px;
  height: 15px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  flex-shrink: 0;
}
.card {
  border: 1px solid #e0e6dc;
  background: #fff;
  border-radius: 12px;
  padding: 18px;
  min-width: 0;
}
.stathead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #829080;
}
.stathead svg {
  width: 18px;
  height: 18px;
  color: #5f7f69;
}
.statnum {
  font-size: 26px;
  font-weight: 700;
  line-height: 1.4;
  margin-top: 16px;
  white-space: nowrap;
  letter-spacing: -1px;
  color: #244e39;
  font-variant-numeric: tabular-nums;
}
.statnum span {
  font-size: 10px;
  font-weight: 400;
  color: #8d9889;
  margin-right: 5px;
  letter-spacing: 0;
}
.statfoot {
  margin-top: 10px;
  font-size: 9px;
  color: #98a18f;
  display: flex;
  align-items: center;
  gap: 5px;
}
.statfoot b {
  color: #6d8c46;
  font-weight: 400;
}
.dashgrid {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(230px, 1fr);
  gap: 18px;
  min-height: 0;
  flex: 1;
}
.panel {
  background: #fff;
  border: 1px solid #e0e6dc;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.panelhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  flex-shrink: 0;
}
.panelhead h3 {
  font-size: 13px;
  margin: 0;
}
.panelhead small {
  font-size: 9px;
  color: #96a08f;
}
.chart {
  height: 180px;
  padding: 0 15px;
  min-height: 90px;
  flex: 1;
  position: relative;
}
.chart svg {
  width: 100%;
  height: 100%;
}
.chartlegend {
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 9px;
  color: #84927f;
}
.dot {
  width: 6px;
  height: 6px;
  display: inline-block;
  background: #315d42;
  border-radius: 50%;
  margin-left: 5px;
}
.dot.light {
  background: #b9cd95;
}
.summarylist {
  padding: 0 20px;
  display: grid;
  gap: 15px;
}
.summaryitem {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  border-bottom: 1px solid #f0f2eb;
  padding-bottom: 14px;
}
.summaryitem span {
  color: #86917f;
}
.summaryitem strong {
  font-weight: 500;
}
.greenbox {
  margin: auto 18px 17px;
  padding: 14px;
  background: #f0f5e9;
  border-radius: 9px;
  color: #5b7654;
  font-size: 10px;
  line-height: 1.9;
}
.greenbox strong {
  display: block;
  color: #45653e;
  font-size: 11px;
}
.dashleft {
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 0;
}
.recent {
  flex: 1.1;
}
.chartpanel {
  flex: 1;
}
.tablewrap {
  min-height: 0;
  flex: 1;
  overflow: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 11px;
  text-align: right;
  white-space: nowrap;
}
th {
  background: #f7f9f3;
  color: #85917c;
  font-weight: 400;
  font-size: 10px;
  padding: 12px 17px;
  border-top: 1px solid #eef1e8;
  border-bottom: 1px solid #eef1e8;
}
td {
  padding: 13px 17px;
  border-bottom: 1px solid #edf1e7;
  color: #56674f;
}
tbody tr:hover {
  background: #fbfcf8;
}
td strong {
  font-size: 11px;
  color: #3d5637;
  font-weight: 500;
}
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 5px;
  padding: 4px 8px;
  font-size: 9px;
  background: #edf5e7;
  color: #678347;
}
.badge.amber {
  background: #f7f1df;
  color: #a48c48;
}
.badge.red {
  background: #faece7;
  color: #b46a52;
}
.footnote {
  color: #91a08c;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 9px;
  flex-shrink: 0;
}
.footnote span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.footnote svg {
  width: 12px;
  height: 12px;
}
.toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 13px 18px;
  border-bottom: 1px solid #edf1e8;
  flex-shrink: 0;
}
.search {
  position: relative;
  flex: 1;
  max-width: 310px;
}
.search svg {
  position: absolute;
  right: 11px;
  top: 10px;
  width: 16px;
  height: 16px;
  color: #9aa78f;
}
.search input {
  width: 100%;
  padding: 10px 35px 10px 12px;
}
.toolbar input,
.toolbar select {
  max-width: 165px;
}
input,
select,
textarea {
  background: #fafbf7;
  border: 1px solid #dfe6d8;
  border-radius: 7px;
  color: #3f5737;
  padding: 10px 11px;
  min-width: 0;
  width: 100%;
}
input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #abc78a;
  border-color: #a9c489;
}
.fullpanel {
  flex: 1;
}
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  color: #96a28a;
  font-size: 10px;
  flex-shrink: 0;
}
.pagination .btn {
  padding: 6px 10px;
}
.empty {
  text-align: center;
  padding: 38px 12px;
  color: #98a38d;
  font-size: 11px;
  white-space: normal;
  line-height: 2;
}
.empty svg {
  display: block;
  width: 34px;
  height: 34px;
  margin: 0 auto 12px;
  opacity: 0.5;
}
.tabs {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.tabs .btn {
  background: transparent;
  border-color: transparent;
}
.tabs .btn.selected {
  background: #e6eedc;
  color: #3d6735;
  border-color: #dae5ce;
}
.document {
  overflow: auto;
  padding: 20px;
  line-height: 2.3;
  color: #64785a;
  font-size: 12px;
}
.document h3 {
  color: #36542d;
  margin-top: 0;
}
.document code {
  background: #edf1e6;
  padding: 2px 5px;
  border-radius: 4px;
}
.importarea {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 24px;
}
.dropzone {
  border: 1px dashed #a9bb96;
  background: #f7faf1;
  border-radius: 12px;
  padding: 25px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  line-height: 1.9;
}
.dropzone > svg {
  width: 35px;
  height: 35px;
  color: #759760;
}
.dropzone p {
  margin: 0;
  color: #90a17e;
  font-size: 11px;
}
.dropzone input {
  max-width: 300px;
}
.schema {
  background: #fafbf7;
  border-radius: 10px;
  padding: 18px;
  font-size: 11px;
  line-height: 2.2;
  color: #819572;
}
.schema b {
  color: #44633a;
}
.schema code {
  direction: ltr;
  display: block;
  text-align: left;
  font-size: 11px;
  color: #517147;
  margin: 10px 0;
}
dialog {
  width: min(720px, calc(100% - 30px));
  border: 1px solid #d6e1cc;
  border-radius: 15px;
  padding: 0;
  box-shadow: 0 30px 100px #153e3530;
  color: #2e4826;
  max-height: 90dvh;
  background: #fff;
}
dialog::backdrop {
  background: #0e2d2560;
  backdrop-filter: blur(3px);
}
.modalhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid #e8eee0;
}
.modalhead h3 {
  margin: 0;
  font-size: 17px;
}
.modalbody {
  padding: 22px 24px;
  max-height: calc(90dvh - 145px);
  overflow: auto;
}
.formgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px 18px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.field label {
  font-size: 11px;
  color: #748a62;
}
.field.full {
  grid-column: 1/-1;
}
.field small {
  font-size: 9px;
  color: #96a484;
}
.modalfoot {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 24px;
  background: #f8faf4;
  border-top: 1px solid #e6ecdc;
}
.formerror {
  color: #ab5846;
  font-size: 11px;
  margin-top: 15px;
  line-height: 1.8;
}
.calculation {
  grid-column: 1/-1;
  border-radius: 8px;
  padding: 14px;
  background: #f0f6e9;
  font-size: 12px;
  color: #567c44;
}
.loading {
  height: 100dvh;
  display: grid;
  place-items: center;
  color: #789268;
}
.login {
  height: 100dvh;
  display: grid;
  place-items: center;
  background: #163f35;
}
.loginbox {
  width: min(400px, 90%);
  padding: 35px;
  background: #fcfdf9;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.loginbox h1 {
  margin: 0;
  color: #2e523c;
}
.loginbox p {
  font-size: 12px;
  color: #87977d;
  line-height: 2;
}
.loginbox label {
  font-size: 12px;
  color: #617b50;
}
.loginbox input {
  margin-top: 8px;
}
#toast {
  position: fixed;
  bottom: 22px;
  left: 28px;
  z-index: 1000;
  background: #214f3c;
  color: #fff;
  box-shadow: 0 8px 30px #153e3520;
  border-radius: 10px;
  padding: 15px 22px;
  transform: translateY(120px);
  transition: 0.25s;
  max-width: 450px;
  font-size: 12px;
  line-height: 1.8;
}
#toast.show {
  transform: translateY(0);
}
.insightgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  padding: 20px;
}
.insight {
  border: 1px solid #e4eadc;
  border-radius: 10px;
  padding: 20px;
}
.insight b {
  display: block;
  font-size: 25px;
  color: #3b6a35;
  margin: 12px 0;
}
.insight small {
  color: #8b9e7b;
  display: block;
  direction: ltr;
  font-size: 10px;
}
.errorpanel {
  padding: 30px;
  line-height: 2;
}
.mobiletitle {
  display: none;
}
@media (min-height: 930px) {
  .content {
    gap: 24px;
    padding-top: 32px;
  }
  .statnum {
    margin-top: 23px;
  }
  .card {
    padding: 23px;
  }
  .chart {
    min-height: 150px;
  }
  .panelhead {
    padding: 22px;
  }
}
@media (max-height: 780px) {
  .sidebar {
    padding-top: 18px;
  }
  .brand {
    margin-bottom: 12px;
  }
  .navitem {
    padding: 8px 13px;
  }
  .navgroup {
    margin-top: 10px;
  }
  .topbar {
    height: 60px;
  }
  .content {
    padding-top: 18px;
    gap: 14px;
  }
  .heading h2 {
    font-size: 22px;
    margin-bottom: 5px;
  }
  .statnum {
    font-size: 23px;
    margin-top: 9px;
  }
  .statfoot {
    margin-top: 5px;
  }
  .card {
    padding: 14px;
  }
  .panelhead {
    padding: 13px 18px;
  }
  .chart {
    min-height: 80px;
  }
  .dashgrid {
    gap: 14px;
  }
  .dashleft {
    gap: 14px;
  }
  td {
    padding-top: 10px;
    padding-bottom: 10px;
  }
  .notice {
    padding: 7px 12px;
  }
  .greenbox {
    padding: 10px;
    font-size: 9px;
  }
  .summarylist {
    gap: 10px;
  }
  .summaryitem {
    padding-bottom: 10px;
  }
}
@media (max-width: 1100px) {
  .shell {
    grid-template-columns: 180px 1fr;
  }
  .sidebar {
    padding-right: 10px;
    padding-left: 10px;
  }
  .topbar {
    padding: 0 20px;
  }
  .content {
    padding-right: 20px;
    padding-left: 20px;
  }
  .cards {
    gap: 10px;
  }
  .statnum {
    font-size: 21px;
  }
  .brand {
    gap: 9px;
  }
  .brand h1 {
    font-size: 22px;
  }
  .dashgrid {
    grid-template-columns: minmax(0, 1.6fr) minmax(210px, 1fr);
  }
  .date {
    display: none;
  }
}
@media (max-width: 800px) {
  .shell {
    grid-template-columns: 66px 1fr;
  }
  .brand {
    margin: 0 auto 20px;
  }
  .brand > div:not(.mark),
  .navitem span,
  .navgroup,
  .sidebarfoot span {
    display: none;
  }
  .sidebar {
    padding: 18px 9px;
  }
  .navitem {
    padding: 12px;
    justify-content: center;
  }
  .navitem.active:after {
    display: none;
  }
  .sidebarfoot {
    padding: 14px 10px;
  }
  .mark {
    width: 38px;
    height: 38px;
  }
  .dashgrid {
    grid-template-columns: 1fr;
  }
  .dashgrid > .panel {
    display: none;
  }
  .cards {
    grid-template-columns: repeat(4, 1fr);
  }
  .statnum {
    font-size: 18px;
  }
  .stathead {
    font-size: 9px;
  }
  .stathead svg {
    display: none;
  }
  .statfoot {
    display: none;
  }
  .card {
    padding: 12px;
  }
  .heading h2 {
    font-size: 20px;
  }
  .profile > div:not(.avatar) {
    display: none;
  }
  .topactions {
    gap: 8px;
  }
  .topbar {

async function load(auto = false) {
  const turn = ++generation;
  const filter =
    auto && report && !portable
      ? {
          party: report.filters.party,
          start: report.filters.from,
          end: report.filters.to,
        }
      : Object.fromEntries(new FormData(q("#filters")));
  const params = new URLSearchParams(
    Object.entries(filter).filter(([, v]) => v),
  );
  q("#status").textContent = "در حال دریافت گزارش…";
  try {
    const result = await api("/api/reports?" + params);
    if (turn !== generation) return;
    report = result;
    if (!auto) currentPage = 1;
    render();
  } catch (e) {
    if (turn !== generation) return;
    if (e.status === 401) {
      catalog = null;
      login();
    } else {
      q("#status").textContent =
        "فیلتر اعمال نشد؛ گزارش قبلی معتبر برای فیلتر قبلی است: " + e.message;
      q("#status").classList.add("report-error");
    }
  }
}

function table(headers, records, columns, paginate = true) {
  const size = 20,
    total = Math.max(1, Math.ceil(records.length / size));
  currentPage = Math.min(currentPage, total);
  const visible = paginate
    ? records.slice((currentPage - 1) * size, currentPage * size)
    : records;
  if (!records.length)
    return '<div class="empty">برای این فیلتر رکوردی ثبت نشده است.</div>';
  return `<div class="panel"><div class="report-table"><table><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${visible.map((r) => `<tr>${columns.map((c) => `<td>${typeof c === "function" ? c(r) : esc(r[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${paginate ? `<div class="pagination"><span>${fa(records.length)} ردیف · صفحه ${fa(currentPage)} از ${fa(total)}</span><div class="buttons"><button class="btn" data-action="prev" ${currentPage <= 1 ? "disabled" : ""}>قبلی</button><button class="btn" data-action="next" ${currentPage >= total ? "disabled" : ""}>بعدی</button></div></div>` : ""}</div>`;
}
function trend() {
  const totals = new Map();
  for (const e of report.events)
    if (e.kind === "فروش")
      totals.set(
        String(e.date),
        (totals.get(String(e.date)) || 0n) + BigInt(e.amount) * BigInt(e.sign),
      );
  const entries = [...totals].slice(-14);
  if (!entries.length) return "";
  const maximum = entries.reduce(
    (a, [, v]) => (v < 0n ? a : v > a ? v : a),
    1n,
  );
  return `<div class="report-trend"><h3>روند فروش · روزهای دارای گردش · ${unitName()}</h3><svg viewBox="0 0 700 130" role="img" aria-label="روند واقعی فروش روزانه"><path class="axis" d="M0 105H700"/>${entries
    .map(([day, v], i) => {
      const x = 15 + i * (670 / entries.length),
        h = Number(((v < 0n ? -v : v) * 80n) / maximum);
      return `<rect class="bar" x="${x}" y="${105 - Math.min(h, 90)}" width="${Math.max(8, Math.min(32, 500 / entries.length))}" height="${Math.min(h, 90)}" rx="5"><title>${esc(date(day))}: ${money(v)} ${unitName()}</title></rect><text x="${x}" y="125">${esc(day.slice(4, 6) + "/" + day.slice(6))}</text>`;
    })
    .join("")}</svg></div>`;
}

root.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-tab],[data-action],[data-table]");
  if (!b) return;
  try {
    if (b.dataset.table) {
      const rows = cloudBundle.tables[b.dataset.table];
      const cols = [...new Set(rows.flatMap((r) => Object.keys(r)))].filter(
        (k) => !k.endsWith("_id") && k !== "id",
      );
      q("#cloudtable").innerHTML = table(
        cols.map((k) => dataLabels[k] || k),
        rows,
        cols,
        false,
      );
      return;
    }
    if (b.dataset.tab) {
      tab = b.dataset.tab;
      currentPage = 1;
      render();
      return;
    }
    const a = b.dataset.action;
    if (a === "source") {
      if (portable) {
        cloudBundle = null;
        catalog = null;
        report = null;
        fileGate();
      } else window.open("/viewer", "_blank");
    } else if (a === "weather") weatherSettings();
    else if (a === "print") print();
    else if (a === "unit") {
      unit = unit === "IRR" ? "IRT" : "IRR";
      b.textContent = unitName();
      render();
    } else if (a === "prev") {
      currentPage--;
      render();
    } else if (a === "next") {
      currentPage++;
      render();
    } else if (a === "logout") {
      if (portable) {
        cloudBundle = null;
        catalog = null;
        report = null;
        fileGate();
        return;
      }
      await api("/api/logout", "POST", {});
      const demo = catalog.demo;
      catalog = null;
      report = null;
      if (demo) await init();
      else login();
    }
  } catch (err) {
    toast(err.message);
  }

    return;
  }
  try {
    health = await api("/api/health");
    catalog = await api("/api/catalog");
    shell();
    await load();
  } catch (e) {
    if (e.status === 401) login();
    else
      root.innerHTML = `<div class="errorpanel"><h2>اتصال به دفتر مرکزی برقرار نشد</h2><p>${esc(e.message)}</p><p>سرویس مرکزی، مسیر فایل و اتصال شبکه را بررسی کنید.</p></div>`;
  }
}
setInterval(() => {
  if (catalog && q("#filters") && document.visibilityState === "visible")
    load(true);
}, 30000);
init();

function fileGate() {
  root.innerHTML = `<div class="cloud-gate"><div class="cloud-story"><span class="hero-kicker">MAZANDASHT / PRIVATE REPORTS</span><h1>دفتر شما،<br>هرجا که هستید.</h1><p>یک داشبورد؛ از فایل خصوصی Drive تا گزارش‌های کامل کسب‌وکار.<br>فایل و رمز شما به این وب‌سایت آپلود نمی‌شوند.</p><div class="hero-chips"><span>AES-256-GCM</span><span>فقط گزارش</span><span>بدون حساب ابری جدید</span></div></div><form id="open-cloud" class="cloud-form"><h2>بازکردن گزارش خصوصی</h2><p>فایل .mazreport را از پوشه خصوصی Drive دانلود یا از Files انتخاب کنید. رمز گزارش را جداگانه از مدیر بگیرید.</p><label>فایل گزارش<input id="cloud-file" type="file" accept=".mazreport" required></label><label>رمز فایل<input id="cloud-password" type="password" autocomplete="off" required></label><button class="btn primary" type="submit">رمزگشایی و مشاهده گزارش</button><div id="cloud-error" role="alert"></div><small>گزارش، نسخه زمان انتشار است؛ اتصال مستقیم یا همگام‌سازی خودکار با Drive نیست.</small></form></div>`;
  q("#open-cloud").addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = e.target.querySelector("button");
    button.disabled = true;
    try {
      cloudBundle = await MazReport.decrypt(
        q("#cloud-file").files[0],
        q("#cloud-password").value,
      );
      q("#cloud-password").value = "";
      await init();
    } catch (error) {
      cloudBundle = null;
      q("#cloud-error").textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
}
let weatherState = null,
  weatherLocation = null;
function weatherSettings() {
  const host = q("#weather");
  if (!host) return;
  host.innerHTML = `<form id="weather-form"><label>نام منطقه<input name="label" placeholder="مثلاً ساری" required></label><div class="weather-coordinates"><label>عرض جغرافیایی<input name="lat" type="number" min="-90" max="90" step="any" required></label><label>طول جغرافیایی<input name="lon" type="number" min="-180" max="180" step="any" required></label></div><button class="btn" type="submit">دریافت آب‌وهوا</button><small>فقط مختصات برای Open-Meteo ارسال می‌شود؛ هیچ داده مالی ارسال نمی‌شود.</small></form>`;
  q("#weather-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    weatherLocation = {
      label: v.label,
      lat: Number(v.lat),
      lon: Number(v.lon),
    };
    await loadWeather();
  });
}
async function loadWeather() {
  if (!weatherLocation) return;
  const host = q("#weather");
  if (host) host.textContent = "دریافت وضعیت واقعی منطقه…";
  try {
    const u = new URL("https://api.open-meteo.com/v1/forecast");
    u.search = new URLSearchParams({
      latitude: weatherLocation.lat,
      longitude: weatherLocation.lon,
      current: "temperature_2m,weather_code,wind_speed_10m,is_day",
      timezone: "auto",
    });
    const response = await fetch(u, {
      signal: AbortSignal.timeout(8000),
      referrerPolicy: "no-referrer",
      credentials: "omit",
    });
    if (!response.ok) throw Error();
    const d = await response.json();
    if (
      typeof d.current?.temperature_2m !== "number" ||
      typeof d.current?.weather_code !== "number"
    )
      throw Error();
    weatherState = { ...d.current, units: d.current_units };
    renderWeather();
  } catch (e) {
    weatherState = null;
    if (q("#weather"))
      q("#weather").innerHTML =
        '<strong>اتصال آب‌وهوا برقرار نشد</strong><small>داده تخمینی نمایش داده نمی‌شود؛ شبکه یا ارائه‌دهنده در دسترس نیست.</small><button class="btn" data-action="weather">تنظیم دوباره منطقه</button>';
  }
}
function renderWeather() {
  const host = q("#weather");
  if (!host) return;
  if (!weatherState) {
    if (weatherLocation) loadWeather();
    return;
  }
  const rainy = weatherState.weather_code >= 50,
    cloudy = weatherState.weather_code > 0;
  host.className = "weather " + (rainy ? "rainy" : cloudy ? "cloudy" : "sunny");
  host.innerHTML = `<span class="weather-orbit">${rainy ? "☂" : cloudy ? "☁" : "☀"}</span><span>${esc(weatherLocation.label)}</span><strong>${fa(weatherState.temperature_2m)}° <small>${rainy ? "بارش" : cloudy ? "ابری / مه" : "آسمان صاف"}</small></strong><small>باد ${fa(weatherState.wind_speed_10m)} ${esc(weatherState.units.wind_speed_10m)} · ${esc(weatherState.time)}</small><button class="btn" data-action="weather">تغییر منطقه</button><small>Open-Meteo · وضعیت دریافتی، نه پیش‌بینی ساختگی</small>`;
}
