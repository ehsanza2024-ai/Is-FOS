name: Validate Mazandasht
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: node --check static/app.js && node --check static/reports.js && node --check static/portable.js && node --check static/workspace.js
      - run: python -m scripts.build_delivery
      - uses: actions/upload-artifact@v4
        with:
          name: Mazandasht-development-source-and-blank-template
          path: private/delivery/Mazandasht-Software-0.8.0.zip
